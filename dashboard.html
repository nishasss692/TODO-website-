<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SleekTask • Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard-shell">
    <!-- Sidebar -->
    <aside class="dashboard-sidebar">
      <div class="sidebar-brand">
        <div class="logo-icon"></div>
        <span class="brand-text">SleekTask</span>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item active" id="nav-all-tasks">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="nav-icon">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
          </svg>
          <span class="nav-label">My Tasks</span>
        </button>

        <button class="nav-item" id="nav-completed-tasks">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="nav-icon">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <span class="nav-label">Completed</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <button class="btn-signout" id="btn-dashboard-signout">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="icon">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
          </svg>
          Sign Out
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="dashboard-main">
      <!-- Header -->
      <header class="dashboard-header">
        <div class="header-left">
          <div class="header-content">
            <h1 id="page-title">My Tasks</h1>
            <p class="header-date" id="current-date">Today</p>
          </div>
        </div>
        <div class="header-right">
          <div class="user-info">
            <div class="user-avatar"></div>
            <span id="user-email">user@example.com</span>
          </div>
        </div>
      </header>

      <!-- Content Area -->
      <div class="dashboard-content">
        <div class="task-board">
          <div class="board-header">
            <span class="task-count" id="task-count">0 tasks</span>
          </div>

          <!-- Task List -->
          <div class="task-list" id="task-list">
            <!-- Tasks render here -->
          </div>

          <!-- Empty State -->
          <div class="empty-state" id="empty-state">
            <div class="empty-icon-wrapper">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="empty-icon">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12c0 1.268-.63 2.39-1.593 3.068a3.745 3.745 0 01-1.043 3.296 3.745 3.745 0 01-3.296 1.043A3.745 3.745 0 0112 21c-1.268 0-2.39-.63-3.068-1.593a3.746 3.746 0 01-3.296-1.043 3.745 3.745 0 01-1.043-3.296A3.745 3.745 0 013 12c0-1.268.63-2.39 1.593-3.068a3.745 3.745 0 011.043-3.296 3.746 3.746 0 013.296-1.043A3.746 3.746 0 0112 3c1.268 0 2.39.63 3.068 1.593a3.746 3.746 0 013.296 1.043 3.746 3.746 0 011.043 3.296A3.745 3.745 0 0121 12z" />
              </svg>
            </div>
            <p>Your task list is empty</p>
            <span class="empty-hint">Add your first task below to get started</span>
          </div>
        </div>

        <!-- Add Task Form -->
        <div class="add-task-section">
          <form class="add-task-form" id="add-task-form">
            <input type="text" id="task-input" placeholder="Add a new task..." autocomplete="off" />
            <button type="submit" class="btn-add-task" aria-label="Add task">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="icon">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
              </svg>
            </button>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
